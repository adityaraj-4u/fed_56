<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL University Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Lobster Two", sans-serif;
            background-color: #f9f9f9;
        }

        h1 {
            color: rgb(42, 132, 165);
            text-align: center;
            text-decoration: underline;
            text-shadow: 5px 5px 5px black;
            font-weight: 400;
            font-size: 50px;
            margin-top: 20px;
        }

        .box-h1 {
            border: 2px solid rgb(229, 197, 138);
            background-color: aqua;
            margin: 10px auto;
            border-radius: 5px;
            width: fit-content;
            padding: 10px 20px;
        }

        #hw {
            color: aquamarine;
            text-align: center;
            -webkit-text-stroke: 1px rgb(168, 255, 128);
            font-size: xx-large;
            margin-top: 20px;
        }

        .button-allin {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            background-color: teal;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-family: "Lobster Two", sans-serif;
            text-shadow: 1px 1px 2px black;
        }

        button:hover {
            background-color: rgb(64, 171, 224);
        }
    </style>
</head>
<body>
    <h1 class="box-h1">hellooooooooooooo world</h1>
    <h2 id="hw">welcome to internal css</h2>

    <div class="button-allin">
        <button>Submit</button>
    </div>
</body>
</html>
